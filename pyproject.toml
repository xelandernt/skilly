[build-system]
requires = [
    "maturin>=1.7,<2"
]
build-backend = "maturin"


[project]
name = "skilly"
description = "Manage agent skills."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "packaging>=26.2",
]
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
repository = "https://github.com/xelandernt/skilly"

[project.scripts]
skilly = "skilly._cli:main"

[dependency-groups]
dev = [
    "maturin>=1.7,<2",
    "prek>=0.3.13",
    "pyrefly>=0.64.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]


[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--ignore=.tox/",
    "--ignore=tmp/"
]
pythonpath=["src", "tests"]

[tool.maturin]
bindings = "pyo3"
python-source = "src"
module-name = "skilly._core"
features = ["python-bindings", "extension-module"]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 88
indent-width = 4
extend-include = ["*.pyi"]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "PYI"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/skilly"]

[tool.pyrefly]
project-includes = [
    "src",
    "tests",
]
search-path = [
    "src",
    "tests",
]
python-version = "3.10"
