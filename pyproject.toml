[build-system]
requires = [
    "hatchling", "hatch-vcs"
]
build-backend = "hatchling.build"


[project]
name = "skilly"
description = "Load skills from dependencies."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cyclopts>=4",
    "niquests>=3",
]
dynamic = ["version"]

[project.scripts]
skilly = "skilly.cli.root:cli"

[dependency-groups]
dev = [
    "prek>=0.3.13",
    "pyrefly>=0.64.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]


[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--ignore=.tox/",
    "--ignore=tmp/"
]
pythonpath=["src", "tests"]


[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.1"

[tool.hatch.build.targets.wheel]
packages = ["src/skilly"]
