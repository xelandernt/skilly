[package]
name = "skilly"
version = "0.0.32"
edition = "2024"
description = "Manage agent skills — create, install, scan, and update skills for AI coding agents"
repository = "https://github.com/anomalyco/skilly"
license = "MIT"
readme = "README.md"
keywords = ["agents", "skills", "ai", "cli"]
categories = ["development-tools"]

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
csv = "1.3"
flate2 = "1.0"
percent-encoding = "2.3"
pyo3 = { version = "0.23", features = ["abi3-py310"], optional = true }
quick-xml = "0.37"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
serde_yaml = "0.9"
tar = "0.4"
toml = "0.8"
url = "2.5"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"
undocumented_unsafe_blocks = "warn"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.rustdoc]
broken_intra_doc_links = "warn"

[features]
default = []
python-bindings = ["dep:pyo3"]
extension-module = ["python-bindings", "pyo3/extension-module"]
