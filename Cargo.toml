[package]
name = "skilly"
version = "0.0.17"
edition = "2024"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
csv = "1.3"
flate2 = "1.0"
percent-encoding = "2.3"
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tar = "0.4"
toml = "0.8"
url = "2.5"
walkdir = "2.5"

[features]
extension-module = ["pyo3/extension-module"]
