name: main

on:
  push:
    branches:
      - main
  pull_request: {}

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-target: ["release"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Build
        run: cargo build --profile ${{ matrix.build-target }}
      - name: Test
        run: cargo test --profile ${{ matrix.build-target }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv python install 3.10
      - run: just install lint

  test-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv python install ${{ matrix.python-version }}
      - run: just install
      - run: uv run pytest . --cov=.

  test-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Install TypeScript launcher dependencies
        run: npm --prefix ts ci
      - name: Test launcher logic
        run: npm --prefix ts test
      - name: Smoke test packaged CLI
        run: |
          set -euo pipefail
          if cargo tree --locked --no-default-features --edges normal | grep -Eq '(^| )pyo3([ -]|$)'; then
            echo "The standalone npm CLI must not contain PyO3 dependencies."
            exit 1
          fi
          cargo build --release --no-default-features --bin skilly
          npm --prefix ts run stage-local-binary
          REPO_ROOT="$PWD"
          TARBALL=$(npm pack --silent ./ts)
          TEMP_DIR=$(mktemp -d)
          trap 'rm -f "${REPO_ROOT}/${TARBALL}"; rm -rf "$TEMP_DIR" "${REPO_ROOT}/ts/vendor"' EXIT
          cd "$TEMP_DIR"
          npm init -y >/dev/null 2>&1
          npm install --silent "${REPO_ROOT}/${TARBALL}"
          ./node_modules/@xelandernt/skilly/dist/src/bin/skilly.js --help
