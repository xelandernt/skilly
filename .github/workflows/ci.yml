name: main

on:
  push:
    branches:
      - main
  pull_request: {}

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-target: ["release"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Build
        run: cargo build --profile ${{ matrix.build-target }}
      - name: Test
        run: cargo test --profile ${{ matrix.build-target }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv python install 3.10
      - run: just install lint

  test-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv python install ${{ matrix.python-version }}
      - run: just install
      - run: uv run pytest . --cov=.

  test-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Install TypeScript launcher dependencies
        run: npm --prefix ts ci
      - name: Test launcher logic
        run: npm --prefix ts test
      - name: Smoke test packaged CLI
        run: |
          cargo build --release --bin skilly
          npm --prefix ts run stage-local-binary
          TARBALL=$(npm pack --silent ./ts)
          npm exec --yes --package "./${TARBALL}" -- skilly --help
          rm -f "$TARBALL"
          rm -rf ts/vendor
