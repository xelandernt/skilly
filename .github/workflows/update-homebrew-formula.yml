name: Update Homebrew Formula

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Release version to sync into Formula/skilly.rb
        required: true

permissions:
  contents: write

jobs:
  update-formula:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}"
          if [[ -z "$version" ]]; then
            echo "Release version is required" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Compute source tarball checksum
        id: checksum
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          tarball_url="https://github.com/xelandernt/skilly/archive/refs/tags/${VERSION}.tar.gz"
          checksum="$(curl -fsSL "$tarball_url" | shasum -a 256 | awk '{print $1}')"
          echo "value=$checksum" >> "$GITHUB_OUTPUT"

      - name: Update Formula/skilly.rb
        env:
          VERSION: ${{ steps.version.outputs.value }}
          CHECKSUM: ${{ steps.checksum.outputs.value }}
        run: python3 scripts/update_homebrew_formula.py "$VERSION" "$CHECKSUM"

      - name: Commit formula update
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/skilly.rb; then
            echo "Formula already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/skilly.rb
          git commit -m "Update Homebrew formula for ${VERSION}"
          git push
